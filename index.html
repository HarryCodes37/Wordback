<style>
/* Layout: one column on phone, tile grid on tablet. Dark charcoal, high contrast, big tap targets. */
:root{
  --bg:#141618; --panel:#1f2327; --panel2:#2a2f35; --line:#3a4148;
  --fg:#f4f6f7; --muted:#aab2ba; --dim:#7d868f;
  --red:#ff4b45; --amber:#ffb21e; --green:#2fd36f; --blue:#5aaeff; --grey:#8b949c; --purple:#c58bff;
  --accent:#e8362e;
  --fs:17px; --r:10px;
  color-scheme:dark;
}
html.ts-large{--fs:20px} html.ts-huge{--fs:23px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#app{min-height:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
h1{font-size:1.6em;margin:.3em 0;letter-spacing:-.01em}
h2{font-size:1.2em;margin:.2em 0 .5em}
h3{font-size:1em;margin:.8em 0 .4em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.8em}
p{margin:.4em 0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 160px;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:2px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:12px 16px;min-height:50px;font-weight:650;cursor:pointer;text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.big{min-height:64px;font-size:1.15em;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.go{background:#13582f;border-color:var(--green);color:#fff}
.btn.warn{background:#5a3d00;border-color:var(--amber);color:#fff}
.btn.danger{background:#5c1210;border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9em}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.amber{border-color:var(--amber);color:var(--amber)} .chip.red{border-color:var(--red);color:var(--red)} .chip.green{border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],input:not([type]),select,textarea{width:100%;background:#0d0f11;border:2px solid var(--line);border-radius:8px;padding:11px 12px;min-height:48px}
textarea{min-height:90px;resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.78em;font-weight:750;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor}
.s-paged{color:var(--grey)} .s-enroute{color:var(--amber)} .s-onscene{color:var(--green)} .s-water{color:var(--amber)} .s-released,.s-left{color:var(--dim)} .s-cancelled{color:var(--dim)} .s-returning{color:var(--blue)} .s-requested{color:var(--amber)} .s-approved{color:var(--blue)} .s-rehab{color:var(--purple)}
.amber{color:var(--amber)} .red{color:var(--red)} .green{color:var(--green)} .blue{color:var(--blue)}
.hr{height:1px;background:var(--line);margin:12px 0}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0b0c0e;border-bottom:3px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:8px}
.top .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top .name{font-weight:750;font-size:1.05em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .clock{font-weight:800;font-size:1.25em}
.top .t2{display:flex;gap:10px;flex-wrap:wrap;font-size:.85em;color:var(--muted);margin-top:2px}
.top .t2 b{color:var(--fg)}
.event{font-size:1.9em;font-weight:850;letter-spacing:.02em;line-height:1.1}
/* timer border */
body.tb-ok #app{box-shadow:inset 0 0 0 6px var(--green)}
body.tb-soon #app{box-shadow:inset 0 0 0 8px var(--amber)}
body.tb-over #app{animation:flash 1s steps(2) infinite}
body.tb-over.acked #app{animation:none;box-shadow:inset 0 0 0 8px var(--red)}
@keyframes flash{0%{box-shadow:inset 0 0 0 10px var(--red)}50%{box-shadow:inset 0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){body.tb-over #app{animation:none;box-shadow:inset 0 0 0 10px var(--red)}}
.timerbar{display:flex;align-items:center;gap:10px;justify-content:space-between;border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel2);cursor:pointer}
.timerbar .lab{font-weight:700}
.timerbar .cd{font-size:1.6em;font-weight:850}
.timerbar.soon{background:#4d3600} .timerbar.over{background:#5c1210}
.banner{background:#173a5c;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;margin-top:8px}
.banner.amber{background:#3d2c00;border-color:var(--amber)}
/* reminders */
.rems{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .tt{font-weight:800;font-size:1.05em;display:flex;justify-content:space-between;gap:6px}
.tile .ts{color:var(--muted);font-size:.85em;overflow:hidden}
.tile.alert{border-color:var(--amber)} .tile.bad{border-color:var(--red)}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 2}.tile.xwide{grid-column:1/-1}}
.app-row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--panel2);cursor:pointer;margin-top:6px;min-width:0}
.app-row .nm{font-weight:750;min-width:0;flex:1}
.app-row .sub{font-size:.82em;color:var(--muted)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:currentColor}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#0b0c0e;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px}
.actions .btn{min-height:54px;padding:6px 4px;font-size:.82em}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 28px)}
.sheet .pane{background:var(--bg);width:100%;max-width:760px;max-height:100%;overflow:auto;border-top:3px solid var(--line);border-radius:16px 16px 0 0;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sheet.full{padding-top:0}.sheet.full .pane{height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:10px 0 8px;z-index:2}
.script{background:#000;border:2px solid var(--fg);border-radius:10px;padding:14px;font-size:1.15em;font-weight:650;line-height:1.4;white-space:pre-wrap}
.log{font-size:.9em}
.log .e{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.log .e .tm{color:var(--muted);font-weight:700}
.log .late{color:var(--amber)}
.steps{display:flex;gap:4px;margin:6px 0 10px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)} .steps i.on{background:var(--fg)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel2);margin-top:6px;cursor:pointer}
.check .bx{width:28px;height:28px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:900}
.check.done .bx{background:var(--green);border-color:var(--green);color:#000}
.check.miss{outline:2px solid var(--amber)}
.check.block{outline:2px solid var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;max-width:90%;text-align:center}
.splash{text-align:center;padding:30px 0 10px}
.splash .logo{font-size:2.6em;font-weight:900;letter-spacing:-.02em}
.splash .logo span{color:var(--accent)}
.banner.red{background:#5c1210;border-color:var(--red);color:#fff;font-weight:800;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{background:#8a1a17}}@media (prefers-reduced-motion:reduce){.banner.red{animation:none}}
.pinned{background:#2b1a0a;border:2px solid #a85a1a;border-radius:10px;padding:8px 12px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92em}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;background:#0d0f11;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.85em;overflow-x:auto}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .v{min-width:44px;text-align:center;font-size:1.3em;font-weight:800}
.lockbar{background:#333;border-radius:10px;padding:10px;margin-top:8px}

.lvlbadge{appearance:none;border:2px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:2px 8px;font-weight:800;font-size:.85em;cursor:pointer;min-height:32px}
.lvlbadge.flash{color:#000;background:var(--amber);border-color:var(--amber);animation:lvl 1s steps(2) infinite}
@keyframes lvl{50%{background:transparent;color:var(--amber)}}
@media (prefers-reduced-motion:reduce){.lvlbadge.flash{animation:none}}

/* ---------- 1.0.3 ---------- */
.themetog{margin-top:4px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.78em;font-weight:700;min-height:28px;cursor:pointer}
.nextst{flex:none;min-height:40px;padding:6px 10px;font-size:.85em;font-weight:800;border-color:var(--green);color:var(--green)}
.tile .ts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.light{--bg:#f2f3f5;--panel:#ffffff;--panel2:#e6e9ec;--line:#b9c0c7;--fg:#101214;--muted:#4a525a;--dim:#69717a;--red:#c8191a;--amber:#a35f00;--green:#0d7a3a;--blue:#1662b8;--grey:#6b737b;--purple:#7a35c2;color-scheme:light}
html.light .top,html.light .actions{background:#ffffff}
html.light input[type=text],html.light input[type=number],html.light input[type=datetime-local],html.light input[type=time],html.light input:not([type]),html.light select,html.light textarea,html.light pre.out{background:#fff;color:var(--fg)}
html.light .script{background:#fff;color:#000;border-color:#000}
html.light .btn.go{background:#d9f5e3;color:#06451f}
html.light .btn.warn{background:#ffeccc;color:#5a3500}
html.light .btn.danger{background:#fde0df;color:#7a0d0c}
html.light .timerbar.soon{background:#ffe7b8} html.light .timerbar.over{background:#ffd3d1}
html.light .banner{background:#e3efff} html.light .banner.amber{background:#fff1d4}
html.light .banner.red{background:#c8191a;color:#fff}
html.light .pinned{background:#fff0e0}
html.light .lockbar{background:#e2e4e7}
html.light .chip.on{background:var(--fg);color:#fff}
.tiles .tile:not(.wide){min-height:66px;padding:10px 12px}

</style>
</head>
<body>

<script>
'use strict';
/* ===== Wordback core: utils, data, storage ===== */
const APP_VERSION = '1.0.4';
const APP_UPDATED = '8 Nov 2026';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const fmtT = t => { if (!t) return '--:--'; const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtTS = t => { if (!t) return '--:--:--'; const d = new Date(t); return fmtT(t) + ':' + pad(d.getSeconds()); };
const fmtD = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const fmtDT = t => t ? fmtD(t) + ' ' + fmtT(t) : '';
const fmtDur = ms => { const neg = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (neg ? '-' : '') + (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(x); };
const fmtHrs = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const toLocalInput = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const titleCase = s => String(s || '').toLowerCase().replace(/\b([a-z])/g, (m, c) => c.toUpperCase()).replace(/\bAnd\b/g, 'and').replace(/\bOf\b/g, 'of');
const clone = o => JSON.parse(JSON.stringify(o));

/* ---- Directory seed (D24 R&R 2026-27 + Callum's pager examples) ---- */
const SEED_BRIGADES = [
  ['Kiewa','KIEW','Bogong'],['Allans Flat','AFLT','Bogong'],['Beechworth','BECU','Bogong'],['Beechworth Rural','BECR','Bogong'],

  ['Bonegilla','BONA','Wodonga'],['Baranduda','BDUD','Wodonga'],['Leneva','LEVA','Wodonga'],['Wodonga','WODO','Wodonga'],['Wodonga West','WWST','Wodonga'],
  ['Bethanga','BETH','Tallangatta'],['Eskdale','ESKD','Tallangatta'],['Noorongong','NONG','Tallangatta'],['Old Tallangatta','TALR','Tallangatta'],

  ['Kergunyah','KERG',''],['Gundowring','GUND',''],['Mt Beauty','MBTY',''],
  ['Barnawartha','BAWA',''],['Chiltern','CHIU',''],['Indigo Valley','INDI',''],['Bright','BRIG',''],['Myrtleford','MYRU',''],['Falls Creek','FCRK',''],['Mitta Mitta','MITT',''],['Tallangatta Valley','TVLY',''],['Corryong','CONU',''],['Rutherglen','RUTR',''],['Porepunkah','PORE',''],['Harrietville','HARV',''],['Mudgegona','MUDG',''],['Gapsted','GAPS',''],['Ovens-Eurobin','OEUR',''],['Rosewhite','RWHT',''],['Buffalo River','BUFR',''],['Browns Plains','BPLN',''],['Wahgunyah','WAHG',''],['Carlyle','CYLE',''],['Cornishtown','CORT',''],['Norong','NORO',''],['Dartmouth','DMTH',''],['Granya','GYRA',''],['Bullioh','BIOH',''],['Berringama','BGAM',''],['Cudgewa','CUWA',''],['Walwa','WALW',''],['Tintaldra','TINT',''],['Burrowye','BWYE',''],['Biggara','BIGG',''],['Nariel Valley','NARI',''],['Mt Hotham-Dinner Plain','MHDP','']
].map(([name, code, group]) => ({ name, code, group, control: name + ' Control' }));

const SEED_DIRECTORY = [
  ['Kiewa Tanker 1','KIEWT1','Kiewa'],['Kiewa Tanker 2','KIEWT2','Kiewa'],['Kiewa Ultralight','','Kiewa'],
  ['Bogong Group FCV 1','','Bogong Group'],['Bogong Group FCV 2','','Bogong Group'],
  ['Allans Flat Tanker 1','AFLTT1','Allans Flat'],['Allans Flat Ultralight','','Allans Flat'],
  ['Wodonga Tanker 1','WODOT1','Wodonga'],['Wodonga Group FCV','','Wodonga Group'],
  ['FRV Wodonga Pumper (P76B)','P76B','FRV Station 76'],['FRV Wodonga Pumper (P76A)','P76A','FRV Station 76'],
  ['Beechworth Rural Light Tanker','','Beechworth Rural'],['Dederang Ultralight','','Dederang'],['Sandy Creek Ultralight','','Sandy Creek'],
  ['Stanley Ultralight','','Stanley'],['Tawonga Light Tanker','','Tawonga'],['Wooragee Light Tanker','','Wooragee'],['Wooragee Ultralight','','Wooragee'],
  ['Yackandandah Light Tanker','','Yackandandah'],['Yackandandah Ultralight','','Yackandandah'],['Yackandandah Pumper Tanker','','Yackandandah'],
  ['Baranduda Ultralight','','Baranduda'],['Wodonga West Light Tanker','','Wodonga West'],['Eskdale Ultralight','','Eskdale'],
  ['Old Tallangatta Ultralight','','Old Tallangatta'],['Talgarno Ultralight','','Talgarno'],['Tallangatta Tanker','','Tallangatta'],
  ['Tallangatta Ultralight','','Tallangatta'],['Tallangatta Pumper Tanker','','Tallangatta'],['Tallangatta Group FCV','','Tallangatta Group'],

const DEFAULT_SETTINGS = {
  name: '', rank: '2nd Lt', brigade: 'Kiewa', homeCode: 'CKIEW',
  myAppliances: ['Kiewa Tanker 1', 'Kiewa Tanker 2', 'Kiewa Ultralight'], defaultAppliance: 'Kiewa Tanker 1',

  directory: SEED_DIRECTORY, brigades: SEED_BRIGADES,
  wbMin: 10, sitrepFirst: 5, sitrepRepeat: 15, rehabWork: 20, rehabLen: 20, rehabRest: 10, baFatigue: 3,
  sound: true, vibrate: true, keepAwake: true, textSize: 'normal'

/* ---- Call types ---- */
const CALL_TYPES = {
  'G&SC': { label: 'Grass and scrub fire', wb: 'Grass and scrub fire', fam: 'gs', fire: true },
  'STRUC': { label: 'Structure fire', wb: 'Structure fire', fam: 'struc', fire: true },
  'NOSTC': { label: 'Non-structure fire', wb: 'Non-structure fire', fam: 'nostc', fire: true },
  'RESCC': { label: 'Rescue', wb: 'Incident', fam: 'resc', fire: false },
  'INCIC': { label: 'Incident', wb: 'Incident', fam: 'inc', fire: false }
};
const KINDS = {
  INCIC: [['MVA / car accident', /\b(MVA|RAR|COLLISION|ACCIDENT|CRASH|VEHICLE|CAR)\b/], ['Alarm (AFA / private)', /\b(ALARM|AFA|PRIVATE)\b/], ['Gas leak', /\bGAS\b/], ['Hazmat / fuel spill', /\b(HAZMAT|SPILL|DIESEL|FUEL|PETROL|OIL|CHEMICAL)\b/], ['Tree down / storm', /\b(TREE|STORM|BRANCH)\b/], ['Powerlines down', /\b(POWER|POWERLINE|POWERLINES|WIRES|LINES)\b/], ['Assist agency (AV / police / SES)', /\b(ASSIST|AV|AMBULANCE|POLICE|SES)\b/], ['Smoke investigation', /\bSMOKE\b/], ['Flooding / wash away', /\b(FLOOD|FLOODING|WASHAWAY|WASH)\b/], ['Animal rescue', /\b(ANIMAL|COW|HORSE|DOG|CAT|SHEEP|LIVESTOCK)\b/], ['Other', null]],
  NOSTC: [['Car / vehicle fire', /\b(CAR|VEHICLE|TRUCK|UTE)\b/], ['MVA with fire', /\b(MVA|COLLISION|ACCIDENT)\b/], ['Rubbish / bin fire', /\b(RUBBISH|BIN|SKIP|PILE)\b/], ['Machinery fire', /\b(MACHINERY|TRACTOR|HEADER|HARVESTER|SLASHER)\b/], ['Other', null]],

/* ---- Storage: IndexedDB with localStorage fallback ---- */
const DB = {
  db: null, mode: 'idb',
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('wordback', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('incidents')) d.createObjectStore('incidents', { keyPath: 'id' }); if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' }); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => { this.mode = 'ls'; res(); };
      } catch (e) { this.mode = 'ls'; res(); }
    });
  },
  tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); },
  put(store, obj) {
    if (this.mode === 'ls') { try { const all = JSON.parse(localStorage.getItem('wb_' + store) || '{}'); all[obj.id || obj.k] = obj; localStorage.setItem('wb_' + store, JSON.stringify(all)); } catch (e) {} return Promise.resolve(); }
    return new Promise(res => { try { const r = this.tx(store, 'readwrite').put(obj); r.onsuccess = r.onerror = () => res(); } catch (e) { res(); } });
  },
  del(store, id) {
    if (this.mode === 'ls') { try { const all = JSON.parse(localStorage.getItem('wb_' + store) || '{}'); delete all[id]; localStorage.setItem('wb_' + store, JSON.stringify(all)); } catch (e) {} return Promise.resolve(); }
    return new Promise(res => { try { const r = this.tx(store, 'readwrite').delete(id); r.onsuccess = r.onerror = () => res(); } catch (e) { res(); } });
  },
  all(store) {
    if (this.mode === 'ls') { try { return Promise.resolve(Object.values(JSON.parse(localStorage.getItem('wb_' + store) || '{}'))); } catch (e) { return Promise.resolve([]); } }
    return new Promise(res => { try { const r = this.tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch (e) { res([]); } });
  },
  clear() {
    if (this.mode === 'ls') { try { localStorage.removeItem('wb_incidents'); localStorage.removeItem('wb_kv'); } catch (e) {} return Promise.resolve(); }
    return Promise.all(['incidents', 'kv'].map(s => new Promise(res => { try { const r = this.tx(s, 'readwrite').clear(); r.onsuccess = r.onerror = () => res(); } catch (e) { res(); } })));
  }
};

/* ===== Pager decoding ===== */
const ROAD_SFX = /^(RD|ROAD|HWY|HIGHWAY|ST|STREET|LANE|LN|AVE|AV|AVENUE|CT|COURT|DR|DRIVE|TRK|TRACK|TCE|PDE|CRES|CR|PL|WAY|BVD|BLVD|TRL|GR|GROVE|CL|CLOSE|FWY|PKWY|RISE|SQ|CIRC|ESP|GAP)$/;
function parsePager(raw) {

  let txt = raw.replace(/\s+/g, ' ').trim().toUpperCase();
  if (!txt) return out;
  // incident number at end
  let m = txt.match(/\s([A-Z]\d{8,10})\s*$/); if (m) { out.incNo = m[1]; txt = txt.slice(0, m.index); }
  const tk = txt.split(' ');

  if (/^(ALERT|NON-?EMERG|NONEMERG|ADMIN|EMERG)/.test(tk[0])) { out.type = tk[0]; i = 1; }
  m = (tk[i] || '').match(/^([A-Z]{3,5})(\d)$/); if (m) { out.areaCode = m[1]; out.area = tk[i]; i++; }
  m = (tk[i] || '').match(/^([A-Z&]+?)([13])$/); if (m) { out.code = m[1]; out.resp = m[2]; out.codeRaw = tk[i]; i++; }
  // map book: SVNE etc, then page, grid square, (grid)
  let mb = -1; for (let j = i; j < tk.length; j++) { if (/^(SV[A-Z]{1,3}|MEL|VCMB)$/.test(tk[j]) && /^\d{3,4}[A-Z]?$/.test(tk[j + 1] || '')) { mb = j; break; } }
  let body = tk.slice(i, mb < 0 ? tk.length : mb);
  let rest = mb < 0 ? [] : tk.slice(mb);
  if (mb >= 0) {
    out.map = rest.slice(0, 3).join(' '); let k = 3;
    if (/^\(\d{6}\)$/.test(rest[3] || '')) { out.grid = rest[3].slice(1, -1); k = 4; }
    rest = rest.slice(k);
    if (rest[0] && /^[FPAR]{1,4}$/.test(rest[0])) { out.services = rest[0]; rest = rest.slice(1); }
    out.paged = rest.filter(Boolean);
  }
  // split details / address
  let a = -1;
  for (let j = 0; j < body.length; j++) { if (/^(\d+[A-Z]?(-\d+)?|CNR|LOT|OPP|NEAR|CORNER)$/.test(body[j]) && j > 0) { a = j; break; } }
  if (a < 0) { for (let j = 0; j < body.length; j++) { if (ROAD_SFX.test(body[j])) { a = Math.max(0, j - 2); break; } } }
  if (a < 0) a = body.length;
  out.details = body.slice(0, a).join(' ').replace(/\s*-\s*$/, '');
  const addr = body.slice(a).join(' ');
  const parts = addr.split(/\s*\/\/?\s*/).map(s => s.trim()).filter(Boolean);
  out.address = parts[0] || '';
  if (/^CNR\s/.test(out.address)) { out.cross = parts.slice(1); }
  else out.cross = parts.slice(1);
  // suburb = words after first road suffix in main address
  const at = out.address.split(' ');
  for (let j = 0; j < at.length; j++) if (ROAD_SFX.test(at[j])) { out.suburb = at.slice(j + 1).join(' '); break; }
  out.ok = !!(out.code || out.details);
  return out;
}

/* ---------- End of job ---------- */
function wrapItems(inc) {
  const fam = famOf(inc); const L = [];
  const add = (label, auto, block) => L.push({ label, auto: !!auto, block: !!block });
  const cOpen = inc.contractors.filter(c => c.status !== 'left');
  if (inc.contractors.length) add('Contractor departure times logged', !cOpen.length, true);
  if (inc.contractors.some(c => (c.runs || []).some(r => !r.end))) add('Contractor machines stopped', false, true);
  add('All appliances accounted for', inc.apps.every(a => ['released', 'cancelled', 'returning'].includes(a.status) || a.brigadeOnly || a.mine));
  if (inc.roads.length) add('Roads reopened', inc.roads.every(r => r.open));
  if (inc.agencies.length) add('Agencies left scene', inc.agencies.every(a => a.status === 'left'));
  if (inc.ba.teams.length) add('All BA teams out', !baInside(inc).length, true);
  if (inc.hazards.some(x => x.name === 'Power lines')) add('Power company notified', inc.agencies.some(a => a.name === 'Power company'));
  if (isFire(inc)) add('Point of origin recorded', !!inc.origin);
  if (fam === 'gs') { add('Edge blacked out / left in black', inc.tactics.some(t => /black/i.test(t.item)) || /black/i.test(inc.notes)); add('Landholder contacted', inc.tactics.some(t => /Landholder/.test(t.item))); }
  if (fam === 'struc') { add('Power and gas isolated', ['Power isolated', 'Gas isolated'].every(x => inc.tactics.some(t => t.item === x))); add('Search complete / no one inside', inc.tactics.some(t => /search|No one/i.test(t.item))); add('Owner / occupier details', !!inc.summary.owner); }
  if (fam === 'veh' || fam === 'mva') { add('Fuel / run-off dealt with', inc.tactics.some(t => /Fuel|Run-off/i.test(t.item))); add('Vehicle handed to police / tow', false); }
  if (fam === 'alarm') add('Alarm reset / keyholder contacted', inc.tactics.some(t => /reset|keyholder/i.test(t.item)));
  if (fam === 'hazmat') add('EPA / authority notified', inc.tactics.some(t => /EPA/.test(t.item)));

  let a = inc.agencies.find(x => x.name === name && x.status !== 'left');
  if (!a) { a = { id: uid(), name, short: name === 'Police' ? '5-6' : name === 'Ambulance (AV)' ? 'AV' : name, status: status || 'requested', hist: [{ t: now(), s: status || 'requested' }], note: '' }; inc.agencies.push(a); logE(name + ' ' + AG_ST[a.status].toLowerCase()); }
  return a;
}
function addContractor(inc, type, status) { const c = { id: uid(), type, company: '', operator: '', machine: '', status: status || 'requested', hist: [{ t: now(), s: status || 'requested' }], runs: [] }; inc.contractors.push(c); logE('Contractor (' + type.toLowerCase() + ') ' + CON_ST[c.status].toLowerCase()); return c; }
function agencyRadioName(a) { return a.name === 'Police' ? '5-6' : a.name === 'Ambulance (AV)' ? 'Ambulance' : a.name; }

const A = {

  wizBack() { S.wiz.step = Math.max(1, S.wiz.step - 1); S.cur.wizStep = S.wiz.step; commit(); },
  wizNext() { const inc = S.cur; if (S.wiz.step === 1) { const m = myApp(inc); m.callsign = inc.myApp; } S.wiz.step++; inc.wizStep = S.wiz.step; window.scrollTo(0, 0); commit(); },
  async wizPaste() { try { const t = await navigator.clipboard.readText(); if (t) { $('#pager').value = t; S.wiz.raw = t; A.wizDecode(); return; } } catch (e) {} toast('Long-press in the box and choose Paste'); $('#pager').focus(); },
  wizDecode() {
    const inc = S.cur; const raw = ($('#pager') || {}).value || S.wiz.raw || '';

  takeControl() { const inc = S.cur; inc.mode = 'control'; logE('Took control'); inc.timersStopped = false; A.myOnScene(); commit(false); },
  resumeControl() { const inc = S.cur; inc.mode = 'control'; inc.timersStopped = false; logE('Resumed control'); commit(); },
  timerTap() { const inc = S.cur; const di = dueInfo(inc); if (!di) return; if (di.due <= now()) { inc.ack = di.due; saveInc(); } if (di.kind === 'wordback') A.openWb(); else A.openSitrep(); },
  remTap(d) {
    const inc = S.cur;
    if (d.k === 'rehab') { const a = findApp(d.id); askConfirm(a.callsign + ' crew due rehab', 'Send the crew to rehab (' + (S.settings.rehabLen || 20) + ' min rehab + ' + S.settings.rehabRest + ' min rest)?', 'Crew to rehab', () => { setAppStatus(inc, a, 'rehab'); closeSheet(); commit(); }, 'go'); S.sheet.alt = { label: 'Remind me in 10 min', id: a.id }; renderSheet(); return; }
    if (d.k === 'rehabback') { const a = findApp(d.id); setAppStatus(inc, a, 'onscene'); commit(); return; }
    if (d.k === 'arrivals') { const names = inc.unreported.map(id => (findApp(id) || {}).callsign).filter(Boolean); radioPrompt({ title: 'Report arrivals', text: 'FireCom, ' + controlLabel(inc) + ', message: ' + names.join(', ') + ' on scene.', later: false }, () => { inc.messages.push({ t: now(), text: names.join(', ') + ' on scene' }); logE('Message to FireCom: ' + names.join(', ') + ' on scene'); inc.unreported = []; }); return; }
    if (d.k === 'msg') { const r = inc.remind.find(x => x.id === d.id); if (!r) return; radioPrompt({ title: 'Message', text: r.script, later: false }, () => { inc.remind = inc.remind.filter(x => x !== r); inc.messages.push({ t: now(), text: r.plain }); logE('Message to FireCom: ' + r.plain); }); return; }
    if (d.k === 'rit') { openSheet({ type: 'ba' }); return; }
    if (d.k === 'handover') { A.startHandover(); return; }
  },
  confirmYes() { const cb = confirmCb; confirmCb = null; if (cb) cb(); else closeSheet(); },
  confirmAlt() { const a = findApp(S.sheet.alt.id); a.rehabDue = now() + 10 * 60000; closeSheet(); commit(); },

  radioLater() { const s = S.sheet; S.cur.remind.push({ id: uid(), text: 'Tell FireCom: ' + s.plain, script: s.text, plain: s.plain }); radioCb = null; closeSheet(); commit(); },

  /* appliances */
  addSt(d) { S.sheet.st = d.v; renderSheet(); },
  addPick(d) { const inc = S.cur; const a = addApp(inc, { callsign: d.cs, code: d.code }, 'paged'); if (S.sheet.st !== 'paged') setAppStatus(inc, a, S.sheet.st); else logE(a.callsign + ' added (paged)'); toast(d.cs + ' added'); S.sheet.q = ''; commit(); },
  addCustom() { const inc = S.cur; const q = (S.sheet.q || '').trim(); if (!q) return; const d = dirByCode(q.toUpperCase()); const a = addApp(inc, d ? { callsign: d.callsign, code: d.code } : { callsign: q, code: /^[A-Z0-9]{3,7}$/.test(q) ? q : '' }, 'paged'); if (S.sheet.st !== 'paged') setAppStatus(inc, a, S.sheet.st); else logE(a.callsign + ' added (paged)'); S.sheet.q = ''; toast(a.callsign + ' added'); commit(); },
  appSt(d) {
    const inc = S.cur, a = findApp(d.id);
    if (a.mine && d.v === 'returning') { openSheet({ type: 'returning' }); return; }
    if (a.mine && d.v === 'onscene' && !inc.onSceneAt) { A.myOnScene(); return; }
    if (d.v === 'released') { askConfirm('Release ' + a.callsign + '?', 'They leave the fireground.', 'Release', () => { setAppStatus(inc, a, 'released'); if (a.task) a.task = null; closeSheet(); commit(); }, 'warn'); return; }
    if (d.v === 'water') {
      const left = inc.apps.filter(x => x !== a && (x.status === 'onscene') && !x.frv && !x.brigadeOnly);
      if (!left.length) { askConfirm('Last tanker on scene', a.callsign + ' is the last tanker on scene. Sending it for water leaves no tanker on the fireground.', 'Send anyway', () => { setAppStatus(inc, a, 'water'); closeSheet(); commit(); }, 'warn'); return; }
    }
    setAppStatus(inc, a, d.v); commit();
  },
  crewAdj(d) { const a = findApp(d.id); a.crew = String(Math.max(0, (Number(a.crew) || 0) + Number(d.v))); if (a.crew === '0') a.crew = ''; saveInc(); renderSheet(); },
  tkType(d) { const s = S.sheet; const a = findApp(s.id); s.task = s.task || normTask(a.task ? clone(a.task) : null); const ty = s.task.types; const i = ty.indexOf(d.v); if (i >= 0) ty.splice(i, 1); else ty.push(d.v); if (!ty.includes('attack')) { delete s.task.sub; delete s.task.lines; } renderSheet(); },
  tkSub(d) { S.sheet.task.sub = S.sheet.task.sub === d.v ? '' : d.v; renderSheet(); },
  tkMore() { S.sheet.more = true; renderSheet(); },
  tkLines(d) { S.sheet.task.lines = S.sheet.task.lines === Number(d.v) ? 0 : Number(d.v); renderSheet(); },
  tkSave(d) { const a = findApp(d.id); const t = Object.assign({}, S.sheet.task, { t: now() }); delete t.type; if (!t.types || !t.types.length) { if (a.task) { a.task = null; logE(a.callsign + ' tasking cleared'); } } else { a.task = t; a.tasks.push(t); logE(a.callsign + ' tasked: ' + taskText(t)); } closeSheet(); commit(); toast('Tasking saved'); },

  /* wordback */
  openWb() { const inc = S.cur; openSheet({ type: 'wordback', d: { status: '', res: [], tankers: 2 } }); },
  openWbRes() { openSheet({ type: 'wordback', d: { status: lastWbStatus(S.cur) || 'nyuc', res: [], tankers: 2 } }); },
  quickWb(d) { openSheet({ type: 'wordback', d: { status: d.v, res: [], tankers: 2 } }); },
  wbSt(d) { S.sheet.d.status = d.v; renderSheet(); },
  wbRes(d) { const r = S.sheet.d.res; const i = r.indexOf(d.v); if (i >= 0) r.splice(i, 1); else r.push(d.v); renderSheet(); },
  wbTank(d) { S.sheet.d.tankers = Number(d.v); renderSheet(); },
  wbCon(d) { S.sheet.d.contractorType = d.v; renderSheet(); },
  wbSent() {
    const inc = S.cur, d = S.sheet.d, t = now(); if (!d.status) return;
    const st = WB_STATUS[d.status];
    const req = d.res.map(k => { const r = RES.find(x => x.k === k); if (k === 'tankers') return 'make tankers ' + d.tankers; if (k === 'contractor') return 'contractor' + (d.contractorType ? ' (' + d.contractorType.toLowerCase() + ')' : ''); return r.plain; });
    const plain = st.plain + (d.desc ? ' (' + d.desc + ')' : '') + (req.length ? '. Requested: ' + req.join(', ') : '');
    inc.wordbacks.push({ t, status: d.status, res: d.res.slice(), plain, script: wbScript(inc, d) });
    logE('Wordback: ' + plain);
    if (!inc.sitreps.length) inc.sitrepDue = t + S.settings.sitrepFirst * 60000;
    d.res.forEach(k => { const r = RES.find(x => x.k === k); if (r.agency) ensureAgency(inc, r.agency, 'requested'); if (r.contractor) addContractor(inc, d.contractorType || 'Other', 'requested'); });
    if (d.res.includes('tankers')) inc.makeTankers = Math.max(inc.makeTankers || 0, d.tankers || 0);
    if (d.status === 'uc' && !inc.underControlAt) inc.underControlAt = t;
    if (['stop', 'falsealarm', 'noaction'].includes(d.status)) {
      if (!inc.stopAt) { inc.stopAt = t; inc.stopVariant = st.label; }
      inc.apps.forEach(a => { if (!a.mine && (a.status === 'enroute' || a.status === 'paged')) setAppStatus(inc, a, 'cancelled'); });
    }
    closeSheet(); commit();
  },
  /* sitrep / message */
  openSitrep() { const inc = S.cur; const prev = inc.sitreps[inc.sitreps.length - 1]; openSheet({ type: 'sitrep', d: { f: prev ? clone(prev.f || {}) : {}, threat: prev ? (prev.threat || []).slice() : [], tac: prev ? (prev.tac || []).slice() : [], useTasks: true, useChanges: true, potential: '', eta: '' } }); },
  srPick(d) { const f = S.sheet.d.f; f[d.k] = f[d.k] === d.v ? '' : d.v; renderSheet(); },
  srThreat(d) { const r = S.sheet.d.threat; const i = r.indexOf(d.v); if (i >= 0) r.splice(i, 1); else { if (d.v === 'Nil') r.length = 0; else { const n = r.indexOf('Nil'); if (n >= 0) r.splice(n, 1); } r.push(d.v); } renderSheet(); },
  srTac(d) { const r = S.sheet.d.tac = S.sheet.d.tac || []; const i = r.indexOf(d.v); if (i >= 0) r.splice(i, 1); else r.push(d.v); renderSheet(); },
  srEta(d) { S.sheet.d.eta = S.sheet.d.eta === d.v ? '' : d.v; renderSheet(); },
  srTog(d) { S.sheet.d[d.v] = !S.sheet.d[d.v]; renderSheet(); },
  srSent() { const inc = S.cur, d = S.sheet.d, t = now(); const text = sitrepText(inc, d); inc.sitreps.push({ t, text, f: clone(d.f), threat: d.threat.slice(), tac: (d.tac || []).slice() }); logE('Sitrep: ' + text.replace(/^FireCom, sitrep from [^.]*\.\s*/, '')); inc.sitrepDue = t + S.settings.sitrepRepeat * 60000; closeSheet(); commit(); },
  openMsg() { openSheet({ type: 'message', d: { text: '' } }); },
  msgSent() { const inc = S.cur, d = S.sheet.d; if (!d.text) return; inc.messages.push({ t: now(), text: d.text }); logE('Message to FireCom: ' + d.text); closeSheet(); commit(); },

  /* agencies */
  agAdd(d) { ensureAgency(S.cur, d.v, 'requested'); commit(); },
  agAddCustom() { const v = (S.sheet.custom || '').trim(); if (!v) return; ensureAgency(S.cur, v, 'requested'); S.sheet.custom = ''; commit(); },
  agSt(d) {

    a.status = d.v; a.hist.push({ t: now(), s: d.v }); logE(a.name + ' ' + AG_ST[d.v].toLowerCase());

    commit();

    if (d.v === 'left' && a.name === 'Police' && inc.roads.some(r => !r.open)) askConfirm('Road reopened?', '5-6 has left but a road is still logged as closed.', 'Open road closures', () => { openSheet({ type: 'hazards' }); }, 'go');
  },

  rdReason(d) { S.sheet.reason = d.v; renderSheet(); },
  rdBy(d) { S.sheet.by = d.v; renderSheet(); },
  roadClose() { const inc = S.cur, s = S.sheet; const road = (s.road || titleCase(roadName(inc.p)) || '').trim(); if (!road) { toast('Which road?'); return; } inc.roads.push({ id: uid(), road, reason: s.reason || '', by: s.by || '', closed: now(), open: null }); logE('Road closed: ' + road + (s.reason ? ' (' + s.reason + ')' : '') + (s.by ? ', by ' + s.by : '')); s.road = ''; s.reason = ''; s.by = ''; if (!inc.agencies.some(a => a.name === 'Police')) toast('Remember to request 5-6 for traffic'); commit(); },
  roadOpen(d) { const r = S.cur.roads.find(x => x.id === d.id); r.open = now(); logE('Road reopened: ' + r.road + (r.reopenReason ? ' (' + r.reopenReason + ')' : '')); commit(); },
  hzTap(d) {
    const inc = S.cur; let h = inc.hazards.find(x => x.name === d.v);
    if (!h) { h = { name: d.v, status: 'identified', t: now() }; inc.hazards.push(h); if (d.v === 'Traffic' && inc.agencies.some(a => a.name === 'Police' && a.status === 'onscene')) h.status = 'managed'; logE('Hazard: ' + d.v + ' (' + h.status + ')'); if (d.v === 'Power lines' && !inc.agencies.some(a => a.name === 'Power company')) { commit(); askConfirm('Power lines', 'Notify the power company? Adds them to Agencies as requested.', 'Request power company', () => { ensureAgency(inc, 'Power company', 'requested'); openSheet({ type: 'hazards' }); commit(); }, 'go'); return; } }
    else { h.status = h.status === 'identified' ? 'managed' : h.status === 'managed' ? 'removed' : 'identified'; logE('Hazard: ' + d.v + ' ' + h.status); }
    commit();
  },
  hzAdd() { const v = (S.sheet.hz || '').trim(); if (!v) return; S.cur.hazards.push({ name: v, status: 'identified', t: now() }); logE('Hazard: ' + v + ' (identified)'); S.sheet.hz = ''; commit(); },
  /* tactics */

  tacCustom() { const v = (S.sheet.custom || '').trim(); if (!v) return; S.cur.tactics.push({ item: v, t: now() }); logE('Action: ' + v); S.sheet.custom = ''; commit(); },
  /* contractors */

  },
  conRun(d) { const c = S.cur.contractors.find(x => x.id === d.id); c.runs = c.runs || []; const r = c.runs.find(r => !r.end); if (r) { r.end = now(); logE('Contractor ' + c.type.toLowerCase() + ' machine stopped (' + fmtHrs(machineMs(c)) + ' total)'); } else { c.runs.push({ start: now(), end: null }); logE('Contractor ' + c.type.toLowerCase() + ' machine started'); } commit(); },
  /* BA */

  condLog() { const c = S.cur.conditions; logE('Conditions: ' + [c.temp && c.temp + 'C', c.wind && c.wind + ' km/h', c.dir && 'from ' + c.dir, c.rh && c.rh + '% RH', c.notes].filter(Boolean).join(', ')); closeSheet(); commit(); },
  originSave() { logE('Point of origin: ' + S.cur.origin); closeSheet(); commit(); },
  logAdd() { const v = (S.sheet.text || '').trim(); if (!v) return; logE(v); S.sheet.text = ''; commit(); },
  /* end */
  endIncident() { const inc = S.cur; if (!inc.timersStopped && myApp(inc) && myApp(inc).status !== 'returning') openSheet({ type: 'returning' }); else openSheet({ type: 'closeout' }); },
  doReturning() { const inc = S.cur; const m = myApp(inc); setAppStatus(inc, m, 'returning'); inc.timersStopped = true; inc.timersStoppedAt = now(); logE('Timers stopped'); saveInc(); render(); openSheet({ type: 'closeout' }); },

  lockInc() { const inc = S.cur; logE('Exported and locked'); inc.locked = true; inc.exportedAt = now(); inc.status = 'closed'; inc.timersStopped = true; commit(); toast('Locked. Now copy, share or PDF it.'); },
  expCopy() { copyText(exportText(S.cur)); },

/* ===== 1.0.2: BA timers, red flag, training, level badge, mud map ===== */
const BA_RATE = 10; // bar per minute (300 bar = 25 min to whistle at 50 bar)
const BA_DECISION = 100, BA_WHISTLE = 50;
function baEst(t) {
  const lb = t.lastBar || t.bar || 300, lt = t.lastBarT || t.in;
  const bar = Math.max(0, lb - BA_RATE * (now() - lt) / 60000);
  return { bar: Math.round(bar), dec: lt + (lb - BA_DECISION) / BA_RATE * 60000, whistle: lt + (lb - BA_WHISTLE) / BA_RATE * 60000, state: bar <= BA_WHISTLE ? 'red' : bar <= BA_DECISION ? 'amber' : 'ok' };
}
function teamState(t) { return t.state || (t.in && !t.out ? 'inside' : t.out ? 'exited' : 'new'); }
function noRitDanger(inc) { return inc.ba.rit === 'none' && inc.ba.teams.some(t => t.mode === 'internal' && teamState(t) === 'inside'); }
function fatigued(t) { return (t.cyl || 0) >= (S.settings.baFatigue || 3); }
function teamLabel(t) { return t.name + (t.cyl ? ', cyl ' + t.cyl : ''); }

SHEETS.ba = s => {

  h += '<label class="f">Rapid intervention team</label><div class="chips">' + chip('RIT ready', b.rit === 'ready', 'baRitSet', { v: 'ready' }, b.rit === 'ready' ? 'green' : '') + chip('No RIT', b.rit === 'none', 'baRitSet', { v: 'none' }, b.rit === 'none' ? 'red' : '') + '</div>';
  h += '<p class="small muted">Times are approximate: about 10 bar a minute, decision point at 100 bar, whistle at 50 bar.</p><h3>Teams</h3>';

    if (fatigued(t)) h += '<div class="small amber" style="margin-top:4px"><b>Fatigue:</b> ' + t.cyl + ' cylinders. Consider rehab or a fresh crew.</div>';
    h += '<div class="chips" style="margin-top:6px">' + chip('External', t.mode === 'external', 'baMode', { id: t.id, v: 'external' }) + chip('Internal', t.mode === 'internal', 'baMode', { id: t.id, v: 'internal' }) + '</div>';

    h += '<input type="text" id="bt_' + t.id + '" data-bind="ba.teams.#' + t.id + '.names" value="' + esc(t.names || '') + '" placeholder="Names or count (optional)" style="margin-top:6px">';
    if (inside) {

      h += '<div class="row" style="margin-top:6px"><span class="' + (e.state === 'red' ? 'red' : e.state === 'amber' ? 'amber' : 'green') + '"><b>~' + e.bar + ' bar</b></span><span class="small">Decision ' + fmtT(e.dec) + ' · Whistle ' + fmtT(e.whistle) + '</span></div>';
      h += '<div class="row" style="margin-top:6px">' + btn('Pressure check', 'baCheckOpen', 'sm', { id: t.id }) + btn('Exited', 'baOut', 'sm go', { id: t.id }) + '</div>';
    } else if (st === 'exited') {
      h += '<div class="row" style="margin-top:6px">' + btn('Rehab', 'baState', 'sm', { id: t.id, v: 'rehab' }) + btn('Ready', 'baState', 'sm', { id: t.id, v: 'ready' }) + btn('Re-enter', 'baState', 'sm warn', { id: t.id, v: 'ready' }) + btn('Clear from board', 'baClear', 'sm ghost', { id: t.id }) + '</div>';
    } else {

      h += '<label class="f">Cylinder pressure (bar)</label><div class="chips">' + [300, 280, 260, 240, 220, 200].map(n => chip(String(n), sb === n, 'baBar', { id: t.id, v: n })).join('') + '</div>';

    }

  });
  h += '<label class="f">Add team</label><div class="chips">' + [1, 2, 3, 4, 5, 6].map(n => { const nm = 'Team ' + n; const has = b.teams.some(t => t.name === nm); return chip(nm, has, has ? 'noop' : 'baAddN', { v: nm }); }).join('') + '</div>';

SHEETS.bacheck = s => {

/* red flag */
function rfActive(inc) { return (inc.redflags || []).find(r => !r.ended); }
function rfTargets(inc) {
  const apps = inc.apps.filter(a => ['onscene', 'water', 'rehab', 'enroute'].includes(a.status)).map(a => ({ id: a.id, name: a.callsign }));
  const cons = inc.contractors.filter(c => c.status === 'onscene').map(c => ({ id: c.id, name: 'Contractor ' + c.type.toLowerCase() + (c.operator ? ' (' + c.operator + ')' : '') }));
  return apps.concat(cons);
}
function rfProgress(inc, r) { const tg = rfTargets(inc); return { total: tg.length, done: tg.filter(x => r.apps[x.id] && r.apps[x.id].confirmed).length }; }
SHEETS.redflag = s => {
  const inc = curInc(); const r = rfActive(inc);
  let h = sheetHd('Red flag warning');
  if (!r) {
    h += '<p class="muted">Declare a red flag to get every truck (and any machinery operator) told, then confirmed that all their crew know.</p>';
    h += '<label class="f">What is the warning?</label><div class="chips">' + ['Wind change', 'Fire behaviour change', 'Spot fires', 'Entrapment risk', 'Falling trees', 'Power lines', 'Withdraw to safe area'].map(x => chip(x, s.text === x, 'rfText', { v: x })).join('') + '</div>';
    h += '<input type="text" id="rf_txt" data-sbind="text" value="' + esc(s.text || '') + '" placeholder="e.g. SW wind change in 15 min" style="margin-top:6px">';
    h += '<div style="margin-top:10px">' + btn('Declare red flag', 'rfStart', 'big danger') + '</div>';
  } else {
    const p = rfProgress(inc, r);
    h += '<div class="banner red">RED FLAG ACTIVE since ' + fmtT(r.t) + ': ' + esc(r.text) + '<br>' + p.done + ' of ' + p.total + ' confirmed</div>';
    h += '<p class="small muted">Anyone who arrives while this is active is added here automatically.</p>';
    rfTargets(inc).forEach(x => {
      const st = r.apps[x.id] || {};
      h += '<div class="card" style="margin-top:6px"><b>' + esc(x.name) + '</b><div class="row" style="margin-top:6px">' +
        '<div class="check' + (st.notified ? ' done' : ' miss') + '" data-a="rfTick" data-id="' + x.id + '" data-v="notified" style="flex:1;margin:0"><span class="bx">' + (st.notified ? '✓' : '') + '</span><div>Notified' + (st.notified ? '<div class="small muted">' + fmtT(st.notified) + '</div>' : '') + '</div></div>' +
        '<div class="check' + (st.confirmed ? ' done' : ' miss') + '" data-a="rfTick" data-id="' + x.id + '" data-v="confirmed" style="flex:1;margin:0"><span class="bx">' + (st.confirmed ? '✓' : '') + '</span><div>All crew told' + (st.confirmed ? '<div class="small muted">' + fmtT(st.confirmed) + '</div>' : '') + '</div></div></div></div>';
    });
    h += '<div style="margin-top:12px">' + btn('Stand down red flag', 'rfEnd', 'full warn') + '</div>';
  }
  return h;
};

/* level badge (R&R p85-86 escalation guide at 5 / 10 / 15 truck level) */
const LEVEL_CHECKS = {
  5: ['4 personnel per truck', '1 command vehicle with 3 personnel', '2 quick fills', 'Control point established and fire named', 'Fireground channel arranged', 'Sectorise', 'Incident management support', 'Aircraft considered', 'Sitrep with potential and prediction', 'Consider: catering, DMO, staging area, heavy machinery, major water supply, EMT, spot weather, DDO, FOV, rehab health monitoring'],
  10: ['3 command vehicles', 'Catering', 'DMOs notified', 'Field Operations Vehicle en route', 'Rehab Health Monitoring Unit en route', 'Staging area personnel notified', 'Major water pumping capacity considered', 'Emergency management personnel to control centre', 'IMT established', 'Aircraft considered', 'Spot weather forecast', 'Ratios: 1 FCV and 2 quick fills per 5 tankers', 'Mobile Amenities Unit', 'Consider: ground observers, SDO / RAC notification, crew changeover transport, staging area, strike teams, community warnings, ultra heavy tanker, bulk water'],
  15: ['Ratios: 1 command vehicle and 2 quick fills per 5 tankers', 'Extra command vehicle per sector', 'Relevant notifications', 'Crew changeovers planned', 'Consider: ground observers, potential escalation to Level 3, IMT expansion, inter-district support, Benalla Big Fill']
};
function truckCount(inc) { const n = inc.apps.filter(a => !a.brigadeOnly && ['onscene', 'enroute', 'water', 'rehab'].includes(a.status)).length; return Math.max(n, inc.makeTankers || 0); }
function levelThreshold(inc) { const n = truckCount(inc); return n >= 15 ? 15 : n >= 10 ? 10 : n >= 5 ? 5 : 0; }
function levelAlert(inc) { const th = levelThreshold(inc); return th && (inc.levelAck || 0) < th ? th : 0; }
SHEETS.level = s => {
  const inc = curInc(); const n = truckCount(inc); const th = levelThreshold(inc);
  let h = sheetHd('Incident level');
  h += '<p>' + n + ' trucks' + (inc.makeTankers ? ' (make tankers ' + inc.makeTankers + ' requested)' : '') + '. The R&amp;R escalation guide kicks in at 5, 10 and 15 trucks. Level classification itself follows the EMV handbook and the DDO.</p>';
  h += '<label class="f">Incident level</label><div class="chips">' + [1, 2, 3].map(l => chip('Level ' + l, (inc.level || 1) === l, 'lvlSet', { v: l }, l > 1 ? 'amber' : '')).join('') + '</div>';
  [5, 10, 15].forEach(k => {
    if (k > th && k !== 5) return;
    h += '<h3>' + k + ' truck level (R&amp;R p85-86)' + (k > th ? ' · not reached yet' : '') + '</h3>';
    LEVEL_CHECKS[k].forEach(it => { const key = k + ':' + it; const d = (inc.levelChecks || {})[key]; h += '<div class="check' + (d ? ' done' : '') + '" data-a="lvlTick" data-v="' + esc(key) + '"><span class="bx">' + (d ? '✓' : '') + '</span><div>' + esc(it) + (d ? '<div class="small muted">' + fmtT(d) + '</div>' : '') + '</div></div>'; });
  });
  if (levelAlert(inc)) h += '<div style="margin-top:12px">' + btn('Acknowledge ' + th + ' truck level', 'lvlAck', 'big warn') + '</div>';
  return h;
};

/* mud map sketch pad */
const MAP_COLORS = ['#f4f6f7', '#ff4b45', '#ffb21e', '#2fd36f', '#5aaeff'];
function drawMap(ctx, w, h, ops, print) {
  ctx.fillStyle = print ? '#ffffff' : '#0d0f11'; ctx.fillRect(0, 0, w, h);
  const ink = c => print && c === '#f4f6f7' ? '#111111' : c;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const fs = Math.max(12, w / 40);
  (ops || []).forEach(o => {
    if (o.k === 'line') { ctx.strokeStyle = ink(o.c); ctx.lineWidth = Math.max(2, w / 220); ctx.beginPath(); o.pts.forEach((p, i) => i ? ctx.lineTo(p[0] * w, p[1] * h) : ctx.moveTo(p[0] * w, p[1] * h)); ctx.stroke(); }
    else if (o.k === 'arrow') {
      const x1 = o.x1 * w, y1 = o.y1 * h, x2 = o.x2 * w, y2 = o.y2 * h, a = Math.atan2(y2 - y1, x2 - x1), L = w / 30;
      ctx.strokeStyle = ctx.fillStyle = print ? '#0050b0' : '#5aaeff'; ctx.lineWidth = Math.max(3, w / 160);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - L * Math.cos(a - .45), y2 - L * Math.sin(a - .45)); ctx.lineTo(x2 - L * Math.cos(a + .45), y2 - L * Math.sin(a + .45)); ctx.closePath(); ctx.fill();
      ctx.font = 'bold ' + fs + 'px sans-serif'; ctx.fillText('WIND', x1 + 4, y1 - 6);
    } else if (o.k === 'stamp') {
      const x = o.x * w, y = o.y * h, r = w / 45; ctx.font = 'bold ' + fs + 'px sans-serif'; ctx.textBaseline = 'middle';
      if (o.s === 'truck') { ctx.fillStyle = '#e8362e'; ctx.fillRect(x - r * 1.4, y - r * .8, r * 2.8, r * 1.6); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(o.short || 'T', x, y); ctx.textAlign = 'left'; ctx.fillStyle = print ? '#111' : '#f4f6f7'; if (o.label) ctx.fillText(o.label, x + r * 1.6, y); }

const MAP_TOOLS = [['pen', 'Draw'], ['road', 'Road'], ['truck', 'Truck'], ['arrow', 'Wind'], ['origin', 'Origin'], ['hazard', 'Hazard'], ['cp', 'CP'], ['wp', 'Water point'], ['gas', 'Gas iso'], ['elec', 'Elec iso'], ['pv', 'PV iso'], ['entry', 'Entry point'], ['text', 'Label'], ['pan', 'Move map']];

initMapCanvas = function () {
  const cv = document.getElementById('mudmap'); if (!cv || cv._init) return; cv._init = true;

  const r0 = cv.getBoundingClientRect(); cv.width = r0.width * dpr; cv.height = r0.height * dpr; redraw();
  let cur = null, drag = null;

  h += '<div class="t1" style="align-items:center"><div class="row" style="gap:10px"><div class="event num mono" id="event">T+ 00:00</div><button class="lvlbadge" id="lvlbadge" data-a="sheet" data-t="level">L' + (inc.level || 1) + '</button></div><div style="text-align:right" class="small"><div class="muted">Paged ' + fmtTS(inc.pageTime) + '</div><div class="muted">' + esc(inc.p.incNo || inc.p.codeRaw || '') + '</div><button class="themetog" data-a="themeTog" aria-label="Switch theme">' + (S.settings.theme === 'light' ? '☾ Dark' : '☀ Light') + '</button></div></div>';
  h += '<div class="t2"><span>FireCom <b>524</b></span><span>Fireground <b>' + (inc.fg.state === 'confirmed' ? esc(inc.fg.ch) : inc.fg.state === 'na' ? 'n/a' : '-') + '</b></span>' + (inc.ba.control && inc.ba.ch && inc.ba.ch !== inc.fg.ch ? '<span>BA <b>' + esc(inc.ba.ch) + '</b></span>' : '') + '<span><b>' + esc(inc.name || '') + '</b></span>' + (inc.cp.loc ? '<span>CP ' + esc(inc.cp.type) + ': <b>' + esc(inc.cp.loc) + '</b></span>' : '') + '</div>';

  if (noRitDanger(inc)) h += '<div class="banner red" data-a="sheet" data-t="ba" style="cursor:pointer">INTERNAL BA WITH NO RIT. HIGH RISK.</div>';
  if (inc.locked) h += '<div class="lockbar">Exported and locked ' + fmtDT(inc.exportedAt) + '. New entries are flagged as late notes.</div>';
  if (inc.status === 'continue') h += '<div class="banner amber">Not closed out. Timers are off. ' + btn('Close out incident', 'closeOut', 'sm go') + '</div>';
  if (inc.mode === 'support') h += '<div class="banner">Support mode: not in control. Timers off. ' + btn('Take control', 'takeControl', 'sm go') + '</div>';
  if (inc.mode === 'logonly') h += '<div class="banner">' + (inc.sectorCmd ? 'Sector Commander under ' : 'Log only: control handed to ') + esc(inc.handover ? (inc.handover.name ? inc.handover.name + ', ' : '') + inc.handover.to : '') + '. ' + btn('Resume control', 'resumeControl', 'sm') + '</div>';
  if (my && (my.status === 'paged' || my.status === 'enroute') && inc.status === 'active') h += '<div style="margin-top:8px">' + btn(my.status === 'paged' ? 'Turning out' : 'ON SCENE', my.status === 'paged' ? 'myEnroute' : 'myOnScene', 'big ' + (my.status === 'paged' ? 'warn' : 'go')) + '</div>';
  h += '<div id="timerbar"></div><div id="bapanel" class="stack" style="gap:6px;margin-top:6px"></div><div class="rems" id="rems"></div>';
  if (isFire(inc) && !inc.origin) h += '<div class="pinned" data-a="sheet" data-t="origin" style="cursor:pointer"><span class="small muted">POINT OF ORIGIN</span> <b><span class="amber">Tap to record</span></b></div>';
  h += '<div class="tiles">' + tiles(inc) + '</div></div>';
  h += '<div class="actions"><div class="wrap">' + btn('Under control', 'quickWb', 'go', { v: 'uc' }) + btn('Stop', 'sheet', 'warn', { t: 'stopvar' }) + btn('Hand over', 'startHandover', '') + btn('End incident', 'endIncident', 'danger') + '</div></div>';
  return h;
};
function tile(t, title, line, cls, extra) { return '<div class="tile' + (cls ? ' ' + cls : '') + '" data-a="sheet" data-t="' + t + '"' + (extra || '') + '><div class="tt">' + title + '</div><div class="ts">' + line + '</div></div>'; }
tiles = function (inc) {
  let h = '';
  const avail = inc.apps.filter(a => a.status === 'onscene' && !a.task && !a.mine && !isAircraft(a)).length;
  h += '<div class="tile wide xwide" data-a="sheet" data-t="apps"><div class="tt"><span>Appliances</span><span class="muted small">' + esc(countsText(inc)) + (avail ? ' · ' + avail + ' available' : '') + '</span></div>';
  inc.apps.filter(a => !['released', 'cancelled'].includes(a.status)).forEach(a => {
    const nx = NEXT[a.status];
    h += '<div class="app-row" data-a="sheet" data-t="app" data-id="' + a.id + '"><span class="dot s-' + a.status + '"></span><div class="nm">' + esc(a.callsign) + (a.mine ? ' <span class="badge blue">You</span>' : '') + (a.auto ? ' <span class="badge">auto</span>' : '') + '<div class="sub">' + esc(ST_LABEL[a.status]) + (a.crew ? ' · ' + esc(a.crew) + ' crew' : '') + (a.task ? ' · ' + esc(taskText(a.task)) : '') + (a.briefed ? ' · briefed' : '') + '</div></div>' + (nx && !(a.mine && a.status === 'paged') ? '<button class="chip nextst" data-a="appNext" data-id="' + a.id + '">' + NEXT_LABEL[a.status] + ' ›</button>' : '<span class="small muted num">' + (a.onSince && a.status !== 'returning' ? fmtT(a.onSince) : '') + '</span>') + '</div>';
  });
  const gone = inc.apps.filter(a => ['released', 'cancelled'].includes(a.status)).length;
  h += '<div class="row" style="margin-top:8px">' + btn('+ Add appliance', 'sheet', 'sm', { t: 'addApp' }) + (gone ? '<span class="muted small">' + gone + ' released / cancelled</span>' : '') + '</div></div>';
  const lw = inc.wordbacks[inc.wordbacks.length - 1];
  h += '<div class="tile' + (!lw && inc.onSceneAt && inc.mode === 'control' ? ' alert' : '') + '" data-a="openWb"><div class="tt">Wordback</div><div class="ts">' + (lw ? '<b class="' + (lw.status === 'nyuc' ? 'red' : lw.status === 'uc' ? 'green' : '') + '">' + esc(WB_STATUS[lw.status].label) + '</b> ' + fmtT(lw.t) : 'Not sent') + '</div></div>';
  const ls = inc.sitreps[inc.sitreps.length - 1];
  h += '<div class="tile" data-a="openSitrep"><div class="tt">Sitrep</div><div class="ts">' + (ls ? 'Last ' + fmtT(ls.t) + ' (' + inc.sitreps.length + ')' : 'None yet') + '</div></div>';
  const rf = rfActive(inc);
  h += tile('redflag', 'Red flag', rf ? '<b class="red">ACTIVE</b> ' + rfProgress(inc, rf).done + '/' + rfProgress(inc, rf).total + ' confirmed' : 'None active', rf ? 'bad' : '');
  const inside = baInside(inc).length;
  h += tile('ba', 'BA', inc.ba.teams.length ? inside + ' inside' + (noRitDanger(inc) ? ' · <b class="red">NO RIT</b>' : inc.ba.rit === 'ready' ? ' · RIT ready' : '') : 'Not in use', noRitDanger(inc) ? 'bad' : inside ? 'alert' : '');
  const rc = inc.roads.filter(r => !r.open).length; const hz = inc.hazards.filter(x => x.status !== 'removed');
  h += tile('hazards', 'Hazards &amp; roads', (rc ? '<b class="amber">' + rc + ' road closed</b> · ' : '') + (hz.length ? esc(hz.map(x => x.name).join(', ')) : 'None logged'), rc ? 'alert' : '');
  h += tile('agencies', 'Agencies', inc.agencies.length ? inc.agencies.map(a => '<span class="s-' + a.status + '">' + esc(a.short || a.name) + '</span>').join(', ') : 'Police, AV, power co.');
  const tl = TACTICS[famOf(inc)] || TACTICS.inc;
  h += tile('tactics', 'Tactics / actions', inc.tactics.length + ' of ' + tl.length + ' done');
  h += tile('brief', 'Briefing &amp; safety', esc(briefSummary(inc)), isFire(inc) && inc.onSceneAt && !(inc.safety || {}).esc1 ? 'alert' : '');
  h += tile('notes', 'Notes &amp; photos', ((inc.photos || []).length ? inc.photos.length + ' photo' + (inc.photos.length > 1 ? 's' : '') + ' · ' : '') + (inc.calls.length ? inc.calls.length + ' call' + (inc.calls.length > 1 ? 's' : '') + ' · ' : '') + (inc.notes ? esc(inc.notes.slice(0, 40)) : 'Notes, calls, photos'));
  h += tile('comms', 'Comms plan', 'FireCom 524 · FG ' + (inc.fg.state === 'confirmed' ? esc(inc.fg.ch) : '-') + ' · signals');
  h += tile('mudmap', 'Mud map', inc.map && inc.map.ops.length ? inc.map.ops.length + ' items' : 'Sketch the fireground');
  if (inc.contractors.length || famOf(inc) === 'gs') h += tile('contractors', 'Contractors', inc.contractors.length ? inc.contractors.map(x => esc(x.type) + ' ' + esc(CON_ST[x.status].toLowerCase())).join(', ') : 'None', contractorsOpen(inc).length ? 'alert' : '');
  h += '<div class="tile wide xwide" data-a="sheet" data-t="log"><div class="tt"><span>Log</span><span class="muted small">' + inc.log.length + ' entries</span></div><div class="log">' + inc.log.slice(-4).reverse().map(e => '<div class="e' + (e.late ? ' late' : '') + '"><span class="tm num">' + fmtT(e.t) + '</span><span>' + esc(e.text) + '</span></div>').join('') + '</div></div>';
  return h;
};
// contractors reachable from agencies when the tile is hidden
const _agSheet = SHEETS.agencies;
SHEETS.agencies = s => _agSheet(s) + (curInc().contractors.length || famOf(curInc()) === 'gs' ? '' : '<div style="margin-top:10px">' + btn('Contractors / machinery', 'sheet', 'full', { t: 'contractors' }) + '</div>');

/* ===== 1.0.4: paged brigades' appliances in Add appliance ===== */
// Neighbour brigades mostly have no appliances in the directory (the R&R doesn't list them),
// so a brigade turnout like CBONA used to leave nothing to pick. Now: suggest that brigade's
// likely appliances, let you pick any brigade, and remember whatever you add.
const BRIG_GENERIC = [['Tanker 1', 'tanker'], ['Tanker 2', 'tanker'], ['Ultralight', 'ult'], ['Pumper', 'other']];
function pagedBrigades(inc) {
  const p = (inc && inc.p) || {}; const home = (S.settings.homeCode || '').replace(/^C/, '');
  const codes = [];
  if (p.areaCode) codes.push(p.areaCode);
  (p.paged || []).forEach(t => { const m = String(t).match(/^C([A-Z]{4})$/); if (m) codes.push(m[1]); });
  const out = [];
  codes.forEach(c => { if (c === home || out.some(b => b.code === c)) return; out.push(brigadeByCode(c) || { name: c, code: c }); });
  return out;
}
function brigadeSuggestions(b, have) {
  const dir = S.settings.directory;
  const own = dir.filter(d => d.brigade && d.brigade.toLowerCase() === b.name.toLowerCase());
  const list = own.map(d => ({ callsign: d.callsign, code: d.code, brigade: d.brigade, cat: appCat(d) }));
  BRIG_GENERIC.forEach(([type, cat]) => {
    // skip generic names only when the brigade has real (non-generic) callsigns of this type
    if (own.some(d => appCat(d) === cat && !BRIG_GENERIC.some(g => d.callsign === b.name + ' ' + g[0]))) return;
    const cs = b.name + ' ' + type;
    if (!list.some(x => x.callsign === cs) && !dir.some(d => d.callsign === cs)) list.push({ callsign: cs, code: '', brigade: b.name, cat, guess: true });
  });
  return list.filter(x => !have.has(x.callsign));
}
function addRow(d) {
  return '<div class="app-row" data-a="addPick" data-cs="' + esc(d.callsign) + '" data-code="' + esc(d.code || '') + '" data-brig="' + esc(d.brigade || '') + '" data-cat="' + esc(d.cat || appCat(d)) + '"><div class="nm">' + esc(d.callsign) + '<div class="sub">' + esc([d.code, d.brigade, d.guess ? 'not in your list yet' : ''].filter(Boolean).join(' · ')) + '</div></div><span class="chip">Add</span></div>';
}
const CATS4 = CATS.concat([['brigade', 'Any brigade']]);
SHEETS.addApp = s => {
  const cat = s.cat || 'tanker';
  const q = (s.q || '').trim().toLowerCase();
  const inc = curInc(); const have = new Set(inc.apps.map(a => a.callsign));
  const paged = pagedBrigades(inc);
  const shown = new Set(); const rows = list => list.filter(d => !shown.has(d.callsign) && shown.add(d.callsign)).map(addRow).join('');
  let h = sheetHd('Add ' + (q ? 'appliance' : cat === 'brigade' ? 'from any brigade' : CATS4.find(c => c[0] === cat)[1].toLowerCase()), s.back);
  h += '<div class="chips">' + CATS4.map(([k, l]) => chip(l, cat === k && !q, 'addCat', { v: k })).join('') + '</div>';
  if (cat === 'brigade' && !q) {
    const sel = s.brig || (paged[0] && paged[0].code) || '';
    h += '<select id="addbrig" style="margin-top:8px"><option value="">Pick a brigade…</option>' + S.settings.brigades.map(b => '<option value="' + esc(b.code) + '"' + (b.code === sel ? ' selected' : '') + '>' + esc(b.name) + ' (' + esc(b.code) + ')</option>').join('') + '</select>';
  }
  h += '<input type="text" id="addq" data-sbind="q" data-live="1" value="' + esc(s.q || '') + '" placeholder="Type callsign, brigade or pager code" autocomplete="off" style="margin-top:8px">';
  h += '<div class="chips" style="margin-top:8px">' + chip('Add as paged', s.st === 'paged', 'addSt', { v: 'paged' }) + chip('En route', s.st === 'enroute', 'addSt', { v: 'enroute' }) + chip('On scene', s.st === 'onscene', 'addSt', { v: 'onscene' }) + '</div>';
  h += '<div id="addlist">';
  if (q) {
    const brigs = S.settings.brigades.filter(b => b.name.toLowerCase().includes(q) || b.code.toLowerCase() === q || ('c' + b.code).toLowerCase() === q);
    const dir = S.settings.directory.filter(d => !have.has(d.callsign) && (d.callsign + ' ' + d.code + ' ' + d.brigade).toLowerCase().includes(q));
    h += rows(dir.slice(0, 40)) + rows([].concat(...brigs.slice(0, 4).map(b => brigadeSuggestions(b, have))));
    h += '<div style="margin-top:8px">' + btn('Add "' + esc(s.q) + '" as custom ' + (cat === 'brigade' ? 'appliance' : CATS4.find(c => c[0] === cat)[1].toLowerCase()), 'addCustom', 'full') + '</div>';
  } else if (cat === 'brigade') {
    const b = S.settings.brigades.find(x => x.code === (s.brig || (paged[0] && paged[0].code))) || paged[0];
    h += b ? rows(brigadeSuggestions(b, have)) + '<p class="small muted" style="margin-top:8px">Not listed? Type the callsign above, e.g. "' + esc(b.name) + ' Tanker 3".</p>' : '<p class="dim">Pick a brigade to see its appliances.</p>';
  } else {
    if (paged.length && cat !== 'aircraft') {
      const pl = [].concat(...paged.map(b => brigadeSuggestions(b, have))).filter(d => d.cat === cat);
      if (pl.length) h += '<h3>Paged on this job: ' + esc(paged.map(b => b.name).join(', ')) + '</h3>' + rows(pl) + '<h3>Everyone else</h3>';
    }
    const list = S.settings.directory.filter(d => !have.has(d.callsign) && appCat(d) === cat);
    const r = rows(list.slice(0, 40));
    h += r || '<p class="dim">Nothing else in this list. Try Any brigade, or type a callsign to add one.</p>';
  }
  return h + '</div>';
};
A.addCat = d => { S.sheet.cat = d.v; S.sheet.q = ''; renderSheet(); };
document.addEventListener('change', e => { if (e.target.id === 'addbrig' && S.sheet) { S.sheet.brig = e.target.value; renderSheet(); } });
// remember anything picked that isn't in the directory yet, so it's there next time and in Settings
const _addPick4 = A.addPick;
A.addPick = function (d) {
  const dir = S.settings.directory;
  if (d.cs && !dir.some(x => x.callsign === d.cs)) { dir.push({ callsign: d.cs, code: d.code || '', brigade: d.brig || '', cat: d.cat || '' }); saveSettings(); }
  _addPick4.apply(A, arguments);
  const a = S.cur.apps[S.cur.apps.length - 1]; if (a && d.cat && ['tanker', 'ult', 'aircraft', 'other'].includes(d.cat)) { a.cat = d.cat; saveInc(); }
};
const _addCustom4 = A.addCustom;
A.addCustom = function () { if (S.sheet && S.sheet.cat === 'brigade') S.sheet.cat = appCat({ callsign: S.sheet.q || '' }); _addCustom4.apply(A, arguments); };

/* ===== Events, bindings, boot ===== */
SHEETS.confirm = s => sheetHd(s.title) + '<p>' + s.body + '</p><div class="stack" style="margin-top:12px">' + btn(esc(s.yes), 'confirmYes', 'big ' + s.cls) + (s.alt ? btn(esc(s.alt.label), 'confirmAlt', 'big') : '') + btn('Cancel', 'closeSheet', 'big ghost') + '</div>';

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a !== 'sheetBg') e.preventDefault();
  try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message); }
});
function patchSheetLive() {
  // re-render the sheet off-screen and patch only live parts so the focused input keeps focus
  if (!S.sheet) return; const def = SHEETS[S.sheet.type]; if (!def) return;
  const tmp = document.createElement('div'); tmp.innerHTML = typeof def === 'function' ? def(S.sheet) : def.html(S.sheet);
  ['scr', 'addlist'].forEach(id => { const a = tmp.querySelector('#' + id), b = document.getElementById(id); if (a && b && a.innerHTML !== b.innerHTML) b.innerHTML = a.innerHTML; });
}
document.addEventListener('input', e => {
  const el = e.target; const ds = el.dataset; const v = el.value;
  if (el.id === 'pager') { if (S.wiz) S.wiz.raw = v; return; }
  if (ds.bind && S.cur) { if (ds.bind === 'name') S.cur.nameAuto = false; setPath(S.cur, ds.bind, v); saveSoon(); patchSheetLive(); return; }
  if (ds.sbind && S.sheet) { setPath(S.sheet, ds.sbind, v); patchSheetLive(); return; }
  if (ds.hbind && S.cur && S.cur.hoDraft) { S.cur.hoDraft[ds.hbind] = v; saveSoon(); return; }
  if (ds.setbind) { S.settings[ds.setbind] = v; saveSettings(); return; }
  if (ds.setnum) { const n = Number(v); if (n > 0) { S.settings[ds.setnum] = n; saveSettings(); } return; }
  if (ds.setcsv) { S.settings[ds.setcsv] = v.split(',').map(x => x.trim()).filter(Boolean); saveSettings(); return; }
  if (ds.setlist) { S.settings[ds.setlist] = v.split('\n').map(x => x.trim()).filter(Boolean); saveSettings(); return; }
  if (ds.setdir) { S.settings.directory = v.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ callsign: p[0], code: (p[1] || '').toUpperCase(), brigade: p[2] || '' })); saveSettings(); return; }
  if (ds.setbrig) { S.settings.brigades = v.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0] && p[1]).map(p => ({ name: p[0], code: p[1].toUpperCase(), control: p[2] || p[0] + ' Control' })); saveSettings(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'pageTime') { const t = new Date(el.value).getTime(); if (!isNaN(t)) { S.cur.pageTime = t; saveInc(); } return; }
  if (el.id === 'restoreFile') { restoreFrom(el.files[0]); el.value = ''; return; }
  if (el.dataset.bind && S.cur) { setPath(S.cur, el.dataset.bind, el.value); if (el.dataset.bind === 'p.code') S.cur.kind = pickKind(el.value, S.cur.p.details || ''); saveInc(); if (el.dataset.rerender) render(); }
  if (el.dataset.setlist || el.dataset.setcsv) render();
});
async function restoreFrom(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'wordback' || !Array.isArray(data.incidents)) throw new Error('Not a Wordback backup');
    askConfirm('Restore backup?', 'Adds ' + data.incidents.length + ' incident(s) from ' + esc(data.exported || 'the file') + '. Incidents already on this device with the same ID are replaced. Settings are replaced too.', 'Restore', async () => {
      for (const inc of data.incidents) { await DB.put('incidents', inc); const i = S.incidents.findIndex(x => x.id === inc.id); if (i >= 0) S.incidents[i] = inc; else S.incidents.push(inc); }
      if (data.settings) { S.settings = Object.assign(clone(DEFAULT_SETTINGS), data.settings); saveSettings(); applySettings(); if (typeof v3Boot==='function') v3Boot(); }
      closeSheet(); go('home'); toast('Restored');
    }, 'go');
  } catch (err) { toast('Could not read that file: ' + err.message); }
}
function applySettings() {
  const r = document.documentElement; r.classList.remove('ts-large', 'ts-huge'); if (S.settings.textSize !== 'normal') r.classList.add('ts-' + S.settings.textSize);
  wakeLock();
}
let wl = null;
async function wakeLock() {
  try {
    const want = S.settings.keepAwake && (S.screen === 'inc' || S.screen === 'handover') && document.visibilityState === 'visible';
    if (want && !wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    if (!want && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}
document.addEventListener('visibilitychange', () => { wakeLock(); if (document.visibilityState === 'visible') tick(); });

async function boot() {
  await DB.open();
  const kv = await DB.all('kv'); const st = kv.find(x => x.k === 'settings');
  if (st && st.v) S.settings = Object.assign(clone(DEFAULT_SETTINGS), st.v);
  S.incidents = await DB.all('incidents');
  applySettings(); if (typeof v3Boot==='function') v3Boot();
  // resume: if exactly one active job, go straight back into it
  const act = S.incidents.filter(i => i.status === 'active' && !i.wizStep).sort((a, b) => b.updated - a.updated);
  if (act.length && act[0].endStep == null && now() - act[0].updated < 12 * 3600000) { S.cur = act[0]; S.screen = 'inc'; }
  render();
  setInterval(tick, 1000);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  // persist storage so iOS is less likely to evict it
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
boot();
